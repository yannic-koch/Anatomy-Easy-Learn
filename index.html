<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Protected Page - Anatomie-Trainer</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid rgba(56, 189, 248, 0.2);
            }

            .staticrypt-page {
                width: 380px;
                padding: 10% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1px;
                background: rgba(15, 23, 42, 0.8);
                backdrop-filter: blur(12px);
                max-width: 380px;
                margin: 0 auto 100px;
                padding: 40px;
                text-align: center;
                border-radius: 20px;
                border: 1px solid rgba(56, 189, 248, 0.3);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(14, 165, 233, 0.2);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 15px;
                outline: 0;
                padding: 15px 40px 15px 15px;
                width: 100%;
                color: #f8fafc;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: rgba(2, 6, 23, 0.7);
                width: 100%;
                border: 1px solid rgba(56, 189, 248, 0.3);
                border-radius: 10px;
                margin: 0 0 20px;
                box-sizing: border-box;
                overflow: hidden;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 70%;
                filter: invert(1);
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: linear-gradient(135deg, #0ea5e9, #2563eb);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;
                font-weight: bold;
                letter-spacing: 1px;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: linear-gradient(135deg, #0284c7, #1d4ed8);
                box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background-image: linear-gradient(rgba(3, 7, 18, 0.5), rgba(3, 7, 18, 0.5)), url('./hintergrund.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
                color: #f8fafc;
            }

            .staticrypt-title {
                font-size: 1.6em;
                font-weight: 700;
                color: #38bdf8;
                letter-spacing: 0.5px;
                text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1.5em;
                color: #94a3b8;
                font-size: 14px;
                cursor: pointer;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 0.8em;
                accent-color: #0ea5e9;
                cursor: pointer;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #030712;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2.5rem;
                height: 2.5rem;
                vertical-align: text-bottom;
                border: 0.25em solid #0ea5e9;
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
